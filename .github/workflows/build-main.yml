name: Build main

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true
      - name: Build macOS amd64
        run: GOOS=darwin GOARCH=amd64 go build -o san_darwin_amd64 ./cmd/san/
      - name: Build Linux amd64
        run: GOOS=linux GOARCH=amd64 go build -o san_linux_amd64 ./cmd/san/
      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: san-main-${{ github.sha }}
          path: |
            san_darwin_amd64
            san_linux_amd64
          retention-days: 14
