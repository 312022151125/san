name: Build main

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: '1.27.1'
          cache: true

      - name: Build and package binaries
        run: |
          VERSION=$(git describe --tags --always --dirty 2>/dev/null || echo "dev")
          BUILDTIME=$(date -u +%Y-%m-%d)
          COMMIT=$(git rev-parse --short HEAD 2>/dev/null || echo "unknown")
          LDFLAGS="-s -w -X main.version=${VERSION} -X main.buildTime=${BUILDTIME} -X main.commit=${COMMIT}"

          mkdir -p bin

          # Build and compress macOS amd64
          CGO_ENABLED=0 GOOS=darwin GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/san ./cmd/san/
          tar -czf bin/san_darwin_amd64.tar.gz -C bin san
          rm bin/san

          # Build and compress Linux amd64
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -ldflags "$LDFLAGS" -o bin/san ./cmd/san/
          tar -czf bin/san_linux_amd64.tar.gz -C bin san
          rm bin/san

          # Checksums
          cd bin && shasum -a 256 san_darwin_amd64.tar.gz san_linux_amd64.tar.gz > SHA256SUMS

      - name: Upload macOS amd64 archive
        uses: actions/upload-artifact@v4
        with:
          name: san_darwin_amd64.tar.gz
          path: bin/san_darwin_amd64.tar.gz
          retention-days: 14

      - name: Upload Linux amd64 archive
        uses: actions/upload-artifact@v4
        with:
          name: san_linux_amd64.tar.gz
          path: bin/san_linux_amd64.tar.gz
          retention-days: 14

      - name: Upload SHA256SUMS
        uses: actions/upload-artifact@v4
        with:
          name: SHA256SUMS
          path: bin/SHA256SUMS
          retention-days: 14
